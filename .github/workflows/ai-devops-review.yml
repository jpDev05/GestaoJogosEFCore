
name: AI DevOps Review

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: AI DevOps Review
        uses: jpDev05/.github-workflows-notion.yml@v1.0.1
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-enabled: "true"
          notion-data-source: "3ec40c50-9a90-80f9-b592-fb72115c0876"